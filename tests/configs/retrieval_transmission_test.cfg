[pyrat]

# Pyrat Bay run mode: [tli atmosphere spectrum opacity retrieval radeq]
runmode = retrieval

# Output file name:
logfile = {ROOT}tests/outputs/retrieval_transmission_test.log

# Radiative-transer observing geometry, select from: [transit emission]
rt_path = transit

# Atmospheric model:
atmfile = inputs/atmosphere_uniform_test.atm

# Line-sampled cross-section files:
sampled_cross_sec = outputs/exttable_test_300-3000K_1.1-1.7um.npz

# Continuum cross-section files:
continuum_cross_sec =
    {ROOT}/pyratbay/data/CIA/CIA_Borysow_H2H2_0060-7000K_0.6-500um.dat
    {ROOT}/pyratbay/data/CIA/CIA_Borysow_H2He_0050-7000K_0.5-031um.dat

# Wavelength sampling boundaries:
wl_low  = 1.1 um
wl_high = 1.7 um

# System parameters:
rstar   = 1.27 rsun
tstar   = 5800.0
smaxis  = 0.045 au
mplanet = 0.6 mjup
rplanet = 1.0 rjup
gplanet = 1487.2
tint    = 100.0
# Reference pressure level at rplanet:
refpressure = 0.1 bar

# Radius-profile model, select from: [hydro_m, hydro_g]
radmodel = hydro_m

# Temperature-profile model, select from [isothermal guillot madhu]
tmodel = guillot

# Cloud models: [lecavelier deck]
clouds = lecavelier  0.0 -4.0

# Retrieval and bulk abundances:
vmr_vars = log_H2O

bulk = H2 He

# Filter bandpasses:
obsfile = inputs/obs_file_WFC3_data.dat
dunits = ppm

offset_inst =
    offset_G102

# Fitting parameters:
retrieval_params =
#   param         value      pmin      pmax   pstep
    log_kappa'     -5.0      -9.0       5.0     1.0
    log_gamma1      0.0      -3.0       3.0     1.0
    log_gamma2      0.0      -3.0       3.0     0.0
    alpha           0.0       0.0       1.0     0.0
    T_irr        1486.0       0.0    7000.0     1.0
    T_int         100.0       0.0     500.0     0.0
    R_planet       1.02       0.5       4.5     1.0
    log_H2O        -4.0      -9.0      -1.0     1.0
    offset_G102     0.0    -200.0      200.0    1.0


# retrieval temperature boundaries (K):
tlow  =  300
thigh = 3000

# MCMC parameters:
sampler  = multinest
nlive = 2000
resume = False
post_processing = False

# Verbosity level:
verb = 2
