[pyrat]

# Pyrat Bay run mode: [tli atmosphere spectrum opacity retrieval radeq]
runmode = spectrum

# Output spectrum file name:
logfile = {ROOT}/tests/outputs/spectrum_transmission_test.log

obsfile_hires = 
    {ROOT}tests/inputs/obs_hires_sinfoni.dat

inst_resolution =  
    all 800.0

# Radiative-transer observing geometry, select from: [transit emission]
rt_path = transit

# System parameters:
rstar = 1.27 rsun
mplanet = 0.6 mjup
rplanet = 1.0 rjup
tint = 100.0
ref_pressure = 0.1 bar

# Atmospheric model
atmfile = {ROOT}tests/inputs/atmosphere_uniform_test.atm
radmodel = hydro_m

# Wavelength sampling boundaries:
wl_low  = 1.1 um
wl_high = 1.7 um

# Line-sampled cross-section files:
sampled_cross_sec = {ROOT}/tests/outputs/exttable_test_300-3000K_1.1-1.7um.npz

# Continuum cross-section files:
continuum_cross_sec =
    {ROOT}/pyratbay/data/CIA/CIA_Borysow_H2H2_0060-7000K_0.6-500um.dat
    {ROOT}/pyratbay/data/CIA/CIA_Borysow_H2He_0050-7000K_0.5-031um.dat

retrieval_params = 
    rv_shift       0.0   -30.0   30.0    0.5

# Verbosity level:
verb = 2
