[pyrat]

# Pyrat Bay run mode [tli atmosphere spectrum radeq opacity retrieval]
runmode = retrieval

# Output file names:
logfile = wasp107b_soss/WASP107b_transit_tls_soss.log

# Verbosity level [1--3]
verb = 2

# Observing geometry, select between: [transit eclipse emission]
rt_path = transit

# The observations
dunits = percent
obsfile = sim_obs_wasp107b_transit_soss.dat

# Wavelength sampling
wl_low = 0.65 um
wl_high = 3.0 um

# System parameters
rstar = 0.660 rsun
mstar = 0.690 msun
tstar = 4430.0

rplanet = 10.345 rearth
mplanet = 30.0 mearth
smaxis  = 0.051 au
ref_pressure = 0.1 bar

# Atmospheric model
nlayers = 81
ptop = 1e-9 bar
pbottom = 1e2 bar

# Temperature-profile model, select from [isothermal guillot madhu]
tmodel = isothermal
tpars = 1000.0

# Composition and abundances
chemistry = free
species =
    H2   He   Na   K    H2O  CH4   CO
    CO2  HCN  NH3  H2S  SO2  C2H2  SO
    NaCl KCl  KOH  OCS  CS2  C2H4  SiH
    SiO
uniform_vmr =
    0.85      0.1445    1.00e-10  1.00e-10  1.00e-10  1.00e-10  1.00e-10
    1.00e-10  1.00e-10  1.00e-10  1.00e-10  1.00e-10  1.00e-10  1.00e-10
    1.00e-10  1.00e-10  1.00e-10  1.00e-10  1.00e-10  1.00e-10  1.00e-10
    1.00e-10

# Radius model (hydrostatic equilibrium)
radmodel = hydro_m


# Line-sampled cross sections
sampled_cross_sec =
    opacity/cross_section_0.15-33.0um_0200-5000K_R025K_H2O_exomol_pokazatel.npz
    opacity/cross_section_0.15-33.0um_0200-5000K_R025K_CO_hitemp_2019.npz
    opacity/cross_section_0.15-33.0um_0200-5000K_R025K_CO2_ames_ai3000k.npz
    opacity/cross_section_0.15-33.0um_0200-5000K_R025K_CH4_exomol_mm.npz
    opacity/cross_section_0.15-33.0um_0200-5000K_R025K_NH3_exomol_coyute.npz
    opacity/cross_section_0.15-33.0um_0200-5000K_R025K_H2S_exomol_ayt2.npz
    opacity/cross_section_0.15-33.0um_0200-5000K_R025K_K_vald.npz

# Continuum cross sections
continuum_cross_sec =
    {ROOT}pyratbay/data/CIA/CIA_Borysow_H2H2_0060-7000K_0.6-500um.dat
    {ROOT}pyratbay/data/CIA/CIA_Borysow_H2He_0050-7000K_0.5-031um.dat

# Clour models [lecavelier deck]
clouds =
    deck  2.0
    lecavelier 0 -4

# Rayleigh models, select from: [rayleigh_H rayleigh_He rayleigh_H2]
rayleigh = 
    rayleigh_H2
    rayleigh_He


# VMR parameters (constant with altitude VMRs)
vmr_vars =
    log_H2O
    log_CO
    log_CO2
    log_CH4
    log_NH3
    log_H2S
    log_K

# Bulk species
bulk = H2 He

# Transit light source model(s)
tls_folder = phoenix/
tls_model =
    tls

retrieval_params = 
#   parameter    value   pmin    pmax    step
    T_iso        900.0   250.0  2000.0   1.0
    log_p_ref     -1.0    -9.0     2.0   1.0
    log_H2O       -6.0   -12.0    -0.3   1.0
    log_CO        -6.0   -12.0    -0.3   1.0
    log_CO2       -6.0   -12.0    -0.3   1.0
    log_CH4       -6.0   -12.0    -0.3   1.0
    log_NH3       -6.0   -12.0    -0.3   1.0
    log_H2S       -6.0   -12.0    -0.3   1.0
    log_K         -6.0   -12.0    -0.3   1.0
    log_p_cl      -1.0    -9.0     2.0   1.0
    log_k_ray      1.0    -2.0    10.0   1.0
    alpha_ray     -1.0   -10.0     0.0   1.0
    T_spot        3000  2300.0  4430.0   1.0
    f_spot         0.1     0.0     1.0   1.0

# Retrieval sampler
sampler = multinest
nlive = 1000
resume = True

# Outputs
theme = xkcd:blue
fig_resolution = 200.0
post_processing = true
dt_retrieval_snapshot = 12
log_wl = 0.7 1.0 1.4 2.0 2.8
