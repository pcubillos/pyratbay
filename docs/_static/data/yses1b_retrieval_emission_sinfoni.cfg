[pyrat]

# Pyrat Bay run mode [tli pt atmosphere spectrum radeq opacity mcmc]
runmode = retrieval

# Output file names
logfile = yses1b_sinfoni/YSES1b_emission_sinfoni.log

# Verbosity level [1--3]
verb = 2

# Observing geometry, select between: [transit eclipse emission f_lambda]
rt_path = f_lambda

# The observations
obsfile_hires = ../data/obs_YSES1b_sinfoni.dat
inst_resolution = 4000.0

# Wavelength sampling
wl_low = 1.8 um
wl_high = 2.5 um
wn_thinning = 2

# System parameters
distance = 94.2 parsec
rplanet = 1.0 rjup
mplanet = 14.0 mjup
smaxis  = 162 au
ref_pressure = 1.0 bar

# Atmospheric model
nlayers = 61
ptop = 1e-9 bar
pbottom = 1e2 bar

# Temperature-profile model, select from [isothermal guillot madhu]
tmodel = madhu
tpars = -3.5 -4.0 0.5 3.0 0.5 1000.0

# Composition
chemistry = equilibrium
species =
    H  He  C  O  N  Na  K  S  Si  Mg Fe  Ti  V  Cl
    H2  H2O  CH4  CO  CO2  HCN  NH3  N2  OH  C2H2  C2H4
    S2  SH  H2S  SO2  SO  TiO  VO  TiO2  VO2
    e-  H-  H+  H2+  He+  Na-  Na+  Mg+ K-  K+  Fe+  Ti+  V+
    MgOH MgH Mg(OH)2  FeO Fe(OH)2 FeS  SiO  SiO2 SiS SiH4 SiH
    MgS Fe- NaOH KOH SH- Si+
    HCl (NaCl)2  NaCl KCl (KCl)2 Cl+ Cl-

# Altitute profile model
radmodel = hydro_m

# Line-sampled cross sections
sampled_cross_sec =
    ../run_opacity/cross_section_1.8-2.5um_0250-4000K_R1M_H2O_exomol.npz
    ../run_opacity/cross_section_1.8-2.5um_0250-4000K_R1M_CO_hitemp_iso26.npz
    ../run_opacity/cross_section_1.8-2.5um_0250-4000K_R1M_CO_hitemp_iso36.npz

# Continuum cross sections
csfile =
    {ROOT}pyratbay/data/CIA/CIA_Borysow_H2H2_0060-7000K_0.6-500um.dat
    {ROOT}pyratbay/data/CIA/CIA_Borysow_H2He_0050-7000K_0.5-031um.dat

# Cloud/haze models
clouds = deck
cpars = 2.0

# Rayleigh models, select from: [lecavelier rayleigh_H rayleigh_He rayleigh_H2]
rayleigh = 
    rayleigh_H2
    rayleigh_He

# Composition parameterization
vmr_vars =
    [M/H]  0.0
    C/O    0.59

# Isotopic-ratio modeling
isotope_ratios = 
# cs_iso   label    iso_ratio
    iso26    26    fill_36
    iso36    36    -1.96

retrieval_params = 
# Param name     value  lo_bound  hi_bound  step   prior  prior_sigma
    rv_shift       0.0    -20.0      20.0    1.0  
    log_p1        -4.0     -9.0       2.0    1.0  
    log_p2        -7.2     -9.0       2.0    1.0  
    log_p3        -1.0     -2.0       2.0    1.0  
    a1             1.5      0.75      2.0    1.0  
    a2             0.3      0.02      2.0    1.0  
    T0           850.0    400.0    2000.0    1.0  
    M_planet      14.0      8.0      20.0    1.0    14.0  3.0
    R_planet       1.9      1.0       3.5    1.0  
    [M/H]          0.0     -2.0       2.5    1.0  
    C/O            0.6      0.01      0.95   1.0  
    iso_36        -2.0     -3.0      -0.3    1.0  
    log_p_cl       2.0     -5.0       2.0    1.0  
    f_patchy       0.5      0.0       1.0    1.0  

# Retrieval setup
sampler = multinest
nlive = 2000
resume = True

# Retrieval temperature boundaries
tlow  =  600
thigh = 4000

# Figure and data outputs
post_processing = False
theme = blue
data_color = tomato
