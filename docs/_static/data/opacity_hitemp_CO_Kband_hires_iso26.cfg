[pyrat]

# Select Pyrat Bay run mode: [tli atmosphere spectrum opacity retrieval radeq]
runmode = opacity

# Output log and cross-section file
logfile = cross_section_R0200K_0150-3000K_1.8-2.5um_hitemp_CO_iso26.log

# Pressure sampling
pbottom = 100 bar
ptop = 1e-9 bar
nlayers = 45

# Temperature profile (needed, but not relevant for cross-section generation)
tmodel = isothermal
tpars = 1000.0

# A simplified H2/He-dominated composition
chemistry = free
species = H2  He  H2O  CO
uniform_vmr = 0.85 0.15 1e-4 1e-4


# Wavelength sampling
wl_low = 1.8 um
wl_high = 2.51 um
resolution = 200_000.0

# Extent of the Voigt profile wings (in HWHM)
voigt_extent = 500.0

# Input TLI file
tlifile = hitemp_li_CO_1.5-3.0um.tli

# If set, extract only this isotope and set its isotopic ratio to 1.0
# instead of the Earth's value (see isotopes.dat file)
single_isotope = 26

# Cross-section temperature sampling
tmin =  150
tmax = 3000
tstep = 150

# Number of CPUs for parallel processing
ncpu = 8

# Verbosity level [0-3]
verb = 2
